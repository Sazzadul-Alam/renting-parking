server:
  port: 9000

spring:
  application:
    name: oauth2-service
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DB:platform_auth}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.platform.oauth2service: INFO
    org.springframework.security: INFO

